services:
  # --------------------------------------------------------------------------------
  # INDEXER SERVICE
  # --------------------------------------------------------------------------------
  - type: web
    name: sooth-indexer
    runtime: node
    plan: starter
    region: singapore
    repo: https://github.com/Tora-Build/sooth-alpha
    branch: render
    # Root directory is blank to respect monorepo lockfile
    rootDir: ""
    # Pnpm filter to install root deps & codegen
    buildCommand: pnpm install && pnpm --filter @sooth/indexer codegen
    # Start command for the indexer
    startCommand: pnpm --filter @sooth/indexer start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sooth-db
          property: connectionString
      - key: NODE_VERSION
        value: 20
      # You must add these manually in the dashboard or sync env groups:
      # - BASE_SEPOLIA_RPC_URL
      # - MONAD_TESTNET_RPC_URL
      # - LENS_TESTNET_RPC_URL

  # --------------------------------------------------------------------------------
  # FRONTEND (Static Site is better for Vite, but Web Service works too if you prefer)
  # --------------------------------------------------------------------------------
  - type: web
    name: sooth-alpha-web
    runtime: node
    plan: starter
    region: singapore
    repo: https://github.com/Tora-Build/sooth-alpha
    branch: render
    rootDir: ""
    buildCommand: pnpm install && pnpm exec turbo build --filter=./apps/web
    startCommand: node apps/web/server.js
    envVars:
      - key: NODE_VERSION
        value: 20
      # All VITE_ variables must be added manually in Render Dashboard:
      # - VITE_BASE_SEPOLIA_RPC_URL
      # - VITE_MONAD_TESTNET_RPC_URL
      # - VITE_MEGAETH_TESTNET_RPC_URL
      # - VITE_ARC_TESTNET_RPC_URL
      # - VITE_WALLETCONNECT_PROJECT_ID
      # - VITE_USE_INDEXER
      # - VITE_INDEXER_URL

databases:
  - name: sooth-db
    region: singapore
    plan: free
    databaseName: ponder
    user: ponder

version: "1"
