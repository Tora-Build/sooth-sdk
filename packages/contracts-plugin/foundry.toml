[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.30"
optimizer = true
optimizer_runs = 1
via_ir = true
remappings = [
    "@core/=../contracts-core/src/",
    "prb-math/=lib/prb-math/src/",
    "forge-std/=lib/forge-std/src/",
    "@openzeppelin/contracts/=lib/openzeppelin-contracts-upgradeable/lib/openzeppelin-contracts/contracts/"
]

[profile.zksync]
src = "src"
out = "zkout"
libs = ["lib"]
solc_version = "0.8.30"
optimizer = true
optimizer_runs = 1
via_ir = false
evm_version = "paris"
remappings = [
    "@core/=../contracts-core/src/",
    "prb-math/=lib/prb-math/src/",
    "forge-std/=lib/forge-std/src/",
    "@openzeppelin/contracts/=lib/openzeppelin-contracts-upgradeable/lib/openzeppelin-contracts/contracts/"
]

[rpc_endpoints]
lensTestnet = "https://rpc.testnet.lens.xyz"
lensMainnet = "https://rpc.lens.xyz"
