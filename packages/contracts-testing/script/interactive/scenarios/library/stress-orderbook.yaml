# Stress Test Scenario
# Places many orders to stress test the orderbook

name: stress-orderbook
description: Stress test with many orders from multiple actors

steps:
  # Setup with large balances
  - actor: alice
    action: mint
    args:
      amount: "1000000"

  - actor: alice
    action: deposit
    args:
      amount: "500000"

  - actor: bob
    action: mint
    args:
      amount: "1000000"

  - actor: bob
    action: deposit
    args:
      amount: "500000"

  - actor: charlie
    action: mint
    args:
      amount: "1000000"

  - actor: charlie
    action: deposit
    args:
      amount: "500000"

  # Alice places many YES orders
  - actor: alice
    action: order
    args:
      outcome: "yes"
      range: "10-20"
      shares: "1000"

  - actor: alice
    action: order
    args:
      outcome: "yes"
      range: "20-30"
      shares: "1000"

  - actor: alice
    action: order
    args:
      outcome: "yes"
      range: "30-40"
      shares: "1000"

  - actor: alice
    action: order
    args:
      outcome: "yes"
      range: "40-50"
      shares: "1000"

  - actor: alice
    action: order
    args:
      outcome: "yes"
      range: "50-60"
      shares: "1000"

  # Bob places many NO orders
  - actor: bob
    action: order
    args:
      outcome: "no"
      range: "40-50"
      shares: "1000"

  - actor: bob
    action: order
    args:
      outcome: "no"
      range: "50-60"
      shares: "1000"

  - actor: bob
    action: order
    args:
      outcome: "no"
      range: "60-70"
      shares: "1000"

  - actor: bob
    action: order
    args:
      outcome: "no"
      range: "70-80"
      shares: "1000"

  - actor: bob
    action: order
    args:
      outcome: "no"
      range: "80-90"
      shares: "1000"

  # Charlie executes many market orders
  - actor: charlie
    action: market
    args:
      side: "buy"
      outcome: "no"
      shares: "500"

  - actor: charlie
    action: market
    args:
      side: "buy"
      outcome: "no"
      shares: "500"

  - actor: charlie
    action: market
    args:
      side: "buy"
      outcome: "yes"
      shares: "500"

  - actor: charlie
    action: market
    args:
      side: "buy"
      outcome: "yes"
      shares: "500"

  - actor: charlie
    action: market
    args:
      side: "buy"
      outcome: "no"
      shares: "500"

  # Check final state
  - actor: alice
    action: state
    args: {}

  - actor: alice
    action: book
    args: {}

  - actor: alice
    action: positions
    args: {}

assertions:
  - "market.has_liquidity"
  - "all_actors.have_positions"
  - "vault.solvent"
  - "no_order_overflow"
