# Multi-Actor Orderbook Scenario
# Tests multiple makers and takers interacting

name: multi-actor-orderbook
description: Multiple actors placing and crossing orders

steps:
  # Setup all actors with funds
  - actor: alice
    action: mint
    args:
      amount: "50000"

  - actor: alice
    action: deposit
    args:
      amount: "25000"

  - actor: bob
    action: mint
    args:
      amount: "50000"

  - actor: bob
    action: deposit
    args:
      amount: "25000"

  - actor: charlie
    action: mint
    args:
      amount: "50000"

  - actor: charlie
    action: deposit
    args:
      amount: "25000"

  # Alice places YES orders at different levels
  - actor: alice
    action: order
    args:
      outcome: "yes"
      range: "30-40"
      shares: "200"

  - actor: alice
    action: order
    args:
      outcome: "yes"
      range: "40-50"
      shares: "300"

  - actor: alice
    action: order
    args:
      outcome: "yes"
      range: "50-60"
      shares: "200"

  # Bob places NO orders at different levels
  - actor: bob
    action: order
    args:
      outcome: "no"
      range: "50-60"
      shares: "200"

  - actor: bob
    action: order
    args:
      outcome: "no"
      range: "60-70"
      shares: "300"

  # Check orderbook state
  - actor: alice
    action: book
    args: {}

  # Charlie crosses some orders as taker
  - actor: charlie
    action: market
    args:
      side: "buy"
      outcome: "no"
      shares: "150"

  - actor: charlie
    action: market
    args:
      side: "buy"
      outcome: "yes"
      shares: "100"

  # Check updated book
  - actor: charlie
    action: book
    args: {}

  # Makers claim their fills
  - actor: alice
    action: orders
    args: {}

  - actor: bob
    action: orders
    args: {}

  # Final positions check
  - actor: alice
    action: positions
    args: {}

assertions:
  - "orderbook.has_liquidity"
  - "charlie.has_positions"
  - "vault.solvent"
