# Market Lifecycle (Multi-Actor)
# 
# Demonstrates full market lifecycle with 5 distinct actor roles:
#   alice   = creator (creates market, provides liquidity)
#   bob     = AMM trader (trades pre-graduation), TickBook maker
#   charlie = TickBook taker (crosses orders to get internal shares), spot seller
#   david   = adjudicator (settles market)
#   ellen   = keeper (claims spot sell proceeds for charlie)
#
# Flow:
#   1. Alice creates market with David as adjudicator
#   2. Bob and Charlie fund and trade on AMM to graduate market
#   3. After graduation, Bob places a maker order (NO)
#   4. Charlie crosses Bob's order (gets YES shares as taker)
#   5. Charlie places a spot sell with his YES shares
#   6. Ellen (keeper) claims spot sell proceeds for Charlie
#   7. David settles the market as YES
#   8. Run invariant checks

name: market-lifecycle-multi-actor
description: Full 5-actor lifecycle from creation through settlement with TickBook spot sells and keeper claims

steps:
  # ============================================================
  # PHASE 0: Snapshot (capture balances BEFORE any minting)
  # ============================================================
  - actor: alice
    action: snapshot
    args: {}

  # ============================================================
  # PHASE 1: Market Creation (Alice creates with David as adjudicator)
  # ============================================================
  - actor: alice
    action: mint
    args:
      amount: "50000"

  - actor: alice
    action: approve
    args:
      contract: "all"

  - actor: alice
    action: createmarket
    args:
      template: "alien"
      liquidity: "500"
      adjudicator: "--adjudicator=david"

  - actor: alice
    action: setmarket
    args:
      address: "created"

  # ============================================================
  # PHASE 2: Fund actors and graduate via AMM trading
  # ============================================================
  - actor: bob
    action: mint
    args:
      amount: "50000"

  - actor: bob
    action: approve
    args:
      contract: "all"

  - actor: bob
    action: deposit
    args:
      amount: "20000"

  - actor: charlie
    action: mint
    args:
      amount: "50000"

  - actor: charlie
    action: approve
    args:
      contract: "all"

  - actor: charlie
    action: deposit
    args:
      amount: "20000"

  # Bob trades on AMM (pre-graduation)
  - actor: bob
    action: market
    args:
      direction: "buy"
      outcome: "yes"
      shares: "100"

  # Charlie trades on AMM (pre-graduation)
  - actor: charlie
    action: market
    args:
      direction: "buy"
      outcome: "yes"
      shares: "200"

  # Graduate the market via fee accumulation
  - actor: bob
    action: graduate
    args:
      steps: "8"

  - actor: bob
    action: marketstatus
    args: {}

  # ============================================================
  # PHASE 3: TickBook trading - Charlie gets internal shares as taker
  # ============================================================
  
  # Bob sets market context
  - actor: bob
    action: setmarket
    args:
      address: "created"

  # Bob places a NO order (maker) - will be crossed by Charlie
  # Range: 45-55 means he's willing to sell NO at 45-55% price
  - actor: bob
    action: order
    args:
      outcome: "no"
      tickRange: "450-550"
      shares: "50"

  # Charlie sets market context
  - actor: charlie
    action: setmarket
    args:
      address: "created"

  # Charlie places a YES order that crosses Bob's NO order
  # As a taker crossing the order, Charlie receives internal YES shares
  - actor: charlie
    action: order
    args:
      outcome: "yes"
      tickRange: "400-600"
      shares: "50"

  # ============================================================
  # PHASE 4: Random TickBook Trading (generates post-grad fees)
  # ============================================================

  # Bob places more NO orders at different price levels
  - actor: bob
    action: order
    args:
      outcome: "no"
      tickRange: "400-450"
      shares: "30"

  - actor: bob
    action: order
    args:
      outcome: "no"
      tickRange: "500-600"
      shares: "40"

  # Charlie crosses Bob's orders with YES orders
  - actor: charlie
    action: order
    args:
      outcome: "yes"
      tickRange: "350-500"
      shares: "35"

  - actor: charlie
    action: order
    args:
      outcome: "yes"
      tickRange: "450-550"
      shares: "25"

  # Bob places YES order (switching sides)
  - actor: bob
    action: order
    args:
      outcome: "yes"
      tickRange: "480-520"
      shares: "20"

  # Charlie places NO order (switching sides)
  - actor: charlie
    action: order
    args:
      outcome: "no"
      tickRange: "520-580"
      shares: "15"

  # ============================================================
  # PHASE 5: Spot Sell - Charlie sells his internal YES shares
  # ============================================================
  
  # Charlie places a spot sell with his YES shares from being a taker
  - actor: charlie
    action: spotsell
    args:
      outcome: "yes"
      tickRange: "500-540"
      shares: "20"

  # ============================================================
  # PHASE 6: Keeper claim - Ellen claims spot sell for Charlie
  # ============================================================
  
  # Ellen needs to be funded and set up
  - actor: ellen
    action: mint
    args:
      amount: "10000"

  - actor: ellen
    action: approve
    args:
      contract: "all"

  - actor: ellen
    action: setmarket
    args:
      address: "created"

  # List spot sells to see the sell ID
  - actor: ellen
    action: spotsells
    args: {}

  - actor: ellen
    action: claimspotsellfor
    args:
      sellId: "0"

  # ============================================================
  # PHASE 7: Token Transfer Tests (BEFORE settlement)
  # LP tokens are transferable pre-settlement, locked post-settlement
  # Internal TickBook shares are NOT user-transferable (by design)
  # ============================================================

  # Alice transfers some LP tokens to Ellen (keeper)
  - actor: alice
    action: transferlp
    args:
      actor: "ellen"
      amount: "50"

  # ============================================================
  # PHASE 8: Settlement - David settles the market
  # ============================================================
  
  - actor: david
    action: setmarket
    args:
      address: "created"

  - actor: david
    action: settle
    args:
      outcome: "yes"

  # ============================================================
  # PHASE 8.5: Verify Trading Stopped (post-settlement)
  # Both AMM and TickBook should reject trades after settlement
  # ============================================================

  # Test: AMM trading should fail after settlement
  - actor: bob
    action: market
    args:
      direction: "buy"
      outcome: "yes"
      shares: "10"
    expect:
      fail: true

  # Test: TickBook order should fail after settlement  
  - actor: bob
    action: order
    args:
      outcome: "yes"
      tickRange: "400-600"
      shares: "10"
    expect:
      fail: true

  # Test: LP transfer should fail after settlement (tokens locked)
  - actor: alice
    action: transferlp
    args:
      actor: "ellen"
      amount: "10"
    expect:
      fail: true

  # ============================================================
  # PHASE 9: Redemption - Actors redeem winning positions + LP
  # ============================================================

  - actor: bob
    action: setmarket
    args:
      address: "created"

  - actor: bob
    action: redeem
    args: {}

  - actor: bob
    action: redeemlp
    args:
      amount: "max"

  - actor: charlie
    action: setmarket
    args:
      address: "created"

  - actor: charlie
    action: redeem
    args: {}

  - actor: charlie
    action: redeemlp
    args:
      amount: "max"

  - actor: alice
    action: setmarket
    args:
      address: "created"

  - actor: alice
    action: redeemlp
    args:
      amount: "max"

  # Ellen redeems her LP tokens (received from Alice before settlement)
  - actor: ellen
    action: redeemlp
    args:
      amount: "max"

  # ============================================================
  # PHASE 10: P&L Summary (including Ellen)
  # ============================================================

  - actor: alice
    action: pnl
    args:
      initial: "50000"

  - actor: bob
    action: pnl
    args:
      initial: "50000"

  - actor: charlie
    action: pnl
    args:
      initial: "50000"

  - actor: ellen
    action: pnl
    args:
      initial: "10000"

  # ============================================================
  # PHASE 11: Verification - Run invariant checks
  # ============================================================
  
  - actor: ellen
    action: invariants
    args: {}

  # ============================================================
  # PHASE 12: Zero-Sum Verification - checksum must equal zero
  # ============================================================

  - actor: ellen
    action: checksum
    args: {}
