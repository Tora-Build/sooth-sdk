# Market Lifecycle (Multi-Actor)
# 
# Demonstrates full market lifecycle with 5 distinct actor roles:
#   alice   = creator (creates market, provides liquidity)
#   bob     = AMM trader (trades pre-graduation), SoothBook maker
#   charlie = SoothBook trader (places orders post-graduation)
#   david   = adjudicator (settles market)
#   ellen   = keeper (receives LP tokens from creator)
#
# Flow:
#   1. Alice creates market with David as adjudicator
#   2. Bob and Charlie fund and trade on AMM to graduate market
#   3. After graduation, actors place SoothBook orders
#   4. Alice transfers LP tokens to Ellen
#   5. David settles the market as YES
#   6. Actors redeem their positions and LP tokens
#   7. Run invariant checks

name: market-lifecycle-multi-actor
description: Full 5-actor lifecycle from creation through settlement with SoothBook trading and LP transfers

steps:
  # ============================================================
  # PHASE 0: Snapshot (capture balances BEFORE any minting)
  # ============================================================
  - actor: alice
    action: snapshot
    args: {}

  # ============================================================
  # PHASE 1: Market Creation (Alice creates with David as adjudicator)
  # ============================================================
  - actor: alice
    action: mint
    args:
      amount: "50000"

  - actor: alice
    action: approve
    args:
      contract: "all"

  - actor: alice
    action: createmarket
    args:
      template: "alien"
      liquidity: "500"
      adjudicator: "--adjudicator=david"

  - actor: alice
    action: setmarket
    args:
      address: "created"

  # ============================================================
  # PHASE 2: Fund actors and graduate via AMM trading
  # ============================================================
  - actor: bob
    action: mint
    args:
      amount: "50000"

  - actor: bob
    action: approve
    args:
      contract: "all"

  - actor: bob
    action: deposit
    args:
      amount: "20000"

  - actor: charlie
    action: mint
    args:
      amount: "50000"

  - actor: charlie
    action: approve
    args:
      contract: "all"

  - actor: charlie
    action: deposit
    args:
      amount: "20000"

  # Bob trades on AMM (pre-graduation)
  - actor: bob
    action: market
    args:
      direction: "buy"
      outcome: "yes"
      shares: "100"

  # Charlie trades on AMM (pre-graduation)
  - actor: charlie
    action: market
    args:
      direction: "buy"
      outcome: "yes"
      shares: "200"

  # Graduate the market via fee accumulation
  - actor: bob
    action: graduate
    args:
      steps: "8"

  - actor: bob
    action: marketstatus
    args: {}

   # ============================================================
   # PHASE 3: SoothBook trading (post-graduation)
   # ============================================================
   
   - actor: bob
     action: setmarket
     args:
       address: "created"

   - actor: bob
     action: order
     args:
       outcome: "no"
       tickRange: "450-550"
       shares: "50"

   - actor: charlie
     action: setmarket
     args:
       address: "created"

   - actor: charlie
     action: order
     args:
       outcome: "yes"
       tickRange: "450-550"
       shares: "25"

   - actor: bob
     action: order
     args:
       outcome: "yes"
       tickRange: "450-550"
       shares: "20"

  # ============================================================
  # PHASE 4: Set up Ellen (keeper)
  # ============================================================

  - actor: ellen
    action: mint
    args:
      amount: "10000"

  - actor: ellen
    action: approve
    args:
      contract: "all"

  - actor: ellen
    action: setmarket
    args:
      address: "created"

  # ============================================================
  # PHASE 5: Token Transfer Tests (BEFORE settlement)
  # LP tokens are transferable pre-settlement, locked post-settlement
   # Internal SoothBook shares are NOT user-transferable (by design)
  # ============================================================

  # Alice transfers some LP tokens to Ellen (keeper)
  - actor: alice
    action: transferlp
    args:
      actor: "ellen"
      amount: "50"

  # ============================================================
  # PHASE 8: Settlement - David settles the market
  # ============================================================
  
  - actor: david
    action: setmarket
    args:
      address: "created"

  - actor: david
    action: settle
    args:
      outcome: "yes"

  # ============================================================
  # PHASE 8.5: Verify Trading Stopped (post-settlement)
   # Both AMM and SoothBook should reject trades after settlement
  # ============================================================

  # Test: AMM trading should fail after settlement
  - actor: bob
    action: market
    args:
      direction: "buy"
      outcome: "yes"
      shares: "10"
    expect:
      fail: true

   # Test: SoothBook order should fail after settlement  
   - actor: bob
     action: order
     args:
       outcome: "yes"
       tickRange: "400-600"
       shares: "10"
     expect:
       fail: true

  # Test: LP transfer should fail after settlement (tokens locked)
  - actor: alice
    action: transferlp
    args:
      actor: "ellen"
      amount: "10"
    expect:
      fail: true

  # ============================================================
  # PHASE 9: Redemption - Actors redeem winning positions + LP
  # ============================================================

  - actor: bob
    action: setmarket
    args:
      address: "created"

   # IMPORTANT: Cancel orders and claim refunds BEFORE redeeming internal outcomes
   # The refund pool uses _marketCollateralWad which gets depleted by redemptions
   - actor: bob
     action: cancel
     args:
       orderId: "all"

   - actor: bob
     action: claimrefunds
     args: {}

   # Now redeem internal outcomes (from order fills)
   - actor: bob
     action: redeem
     args: {}

   - actor: bob
     action: redeemamm
     args: {}

   - actor: bob
     action: redeemlp
     args:
       amount: "max"

   - actor: charlie
     action: setmarket
     args:
       address: "created"

   # Cancel SoothBook orders (claims fills + refunds unfilled collateral)
   - actor: charlie
     action: cancel
     args:
       orderId: "all"

  - actor: charlie
    action: redeem
    args: {}

  - actor: charlie
    action: redeemamm
    args: {}

  # Claim pending refunds from order cancellations
  - actor: charlie
    action: claimrefunds
    args: {}

  - actor: charlie
    action: redeemlp
    args:
      amount: "max"

  - actor: alice
    action: setmarket
    args:
      address: "created"

  - actor: alice
    action: redeemlp
    args:
      amount: "max"

  # Ellen redeems her LP tokens (received from Alice before settlement)
  - actor: ellen
    action: redeemlp
    args:
      amount: "max"

  # ============================================================
  # PHASE 10: P&L Summary (including Ellen)
  # ============================================================

  - actor: alice
    action: pnl
    args:
      initial: "50000"

  - actor: bob
    action: pnl
    args:
      initial: "50000"

  - actor: charlie
    action: pnl
    args:
      initial: "50000"

  - actor: ellen
    action: pnl
    args:
      initial: "10000"

  # ============================================================
  # PHASE 11: Verification - Run invariant checks
  # ============================================================
  
  - actor: ellen
    action: invariants
    args: {}

  # ============================================================
  # PHASE 12: Zero-Sum Verification - checksum must equal zero
  # ============================================================

  - actor: ellen
    action: checksum
    args: {}
