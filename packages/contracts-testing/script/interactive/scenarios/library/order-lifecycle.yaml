# Order Lifecycle Scenario
# Tests the complete lifecycle: place, partial fill, claim, cancel

name: order-lifecycle
description: Test complete order lifecycle including partial fills and cancellation

steps:
  # Setup
  - actor: alice
    action: mint
    args:
      amount: "20000"

  - actor: alice
    action: deposit
    args:
      amount: "10000"

  - actor: bob
    action: mint
    args:
      amount: "20000"

  - actor: bob
    action: deposit
    args:
      amount: "10000"

  # Alice places a large order
  - actor: alice
    action: order
    args:
      outcome: "yes"
      range: "45-55"
      shares: "500"

  # Check order was placed
  - actor: alice
    action: orders
    args: {}

  # Bob partially fills it
  - actor: bob
    action: market
    args:
      side: "buy"
      outcome: "no"
      shares: "100"

  # Alice checks partial fill state
  - actor: alice
    action: getorder
    args:
      orderId: "1"

  # Alice claims the partial fill
  - actor: alice
    action: claim
    args:
      orderId: "1"

  # Check balances after claim
  - actor: alice
    action: balance
    args: {}

  # Bob fills more
  - actor: bob
    action: market
    args:
      side: "buy"
      outcome: "no"
      shares: "150"

  # Alice claims again
  - actor: alice
    action: claim
    args:
      orderId: "1"

  # Alice decides to cancel remaining
  - actor: alice
    action: cancel
    args:
      orderId: "1"

  # Verify order is now inactive
  - actor: alice
    action: getorder
    args:
      orderId: "1"

  # Final balance check - should have received collateral back
  - actor: alice
    action: balance
    args: {}

  - actor: alice
    action: reserved
    args: {}

assertions:
  - "order.1.active == false"
  - "alice.received_collateral_refund"
  - "vault.solvent"
