# Basic Roundtrip Scenario
# Tests the fundamental order placement, crossing, and claim flow

name: basic-roundtrip
description: Place a limit order, cross it with market order, claim fills

steps:
  # Setup: Alice gets funds and deposits
  - actor: alice
    action: mint
    args:
      amount: "10000"

  - actor: alice
    action: deposit
    args:
      amount: "5000"

  # Alice places a YES limit order at 40-60%
  - actor: alice
    action: order
    args:
      outcome: "yes"
      range: "40-60"
      shares: "100"

  # Bob gets funds and deposits
  - actor: bob
    action: mint
    args:
      amount: "10000"

  - actor: bob
    action: deposit
    args:
      amount: "5000"

  # Bob executes market order to buy NO (crosses Alice's YES order)
  - actor: bob
    action: market
    args:
      side: "buy"
      outcome: "no"
      shares: "50"

  # Alice claims her fills
  - actor: alice
    action: claim
    args:
      orderId: "1"

  # Check final positions
  - actor: alice
    action: positions
    args: {}

assertions:
  - "alice.fills > 0"
  - "bob.positions.no >= 50"
  - "vault.solvent"
