[profile.default]
src = "mocks"
out = "out"
libs = ["lib", "core"]
test = "test"
script = "script"
solc_version = "0.8.30"
optimizer = true
optimizer_runs = 1
via_ir = true
remappings = [
    "@core/=core/"
]
fs_permissions = [
    { access = "read-write", path = "./deployments" },
    { access = "read", path = "../contracts-core" }
]

[rpc_endpoints]
baseSepolia = "https://sepolia.base.org"
megaethMainnet = "https://mainnet.megaeth.com/rpc"
megaethTestnet = "https://timothy.megaeth.com/rpc"
monadTestnet = "https://blue-stylish-friday.monad-testnet.quiknode.pro/e8b690b8d333c538f85bab9c93a2a3b512a4cb9a/"
bnbTestnet = "https://data-seed-prebsc-1-s1.bnbchain.org:8545"

[profile.megaeth]
gas_price = 100000000

[profile.monad]
# Standard EIP-1559 gas settings
