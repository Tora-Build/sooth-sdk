<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sooth.Market // Registry Terminal</title>

  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwindcss.config = {
      theme: {
        extend: {
          colors: {
            zinc: {
              50: '#fafafa',
              400: '#a1a1aa',
              500: '#71717a',
              800: '#27272a',
              900: '#18181b',
              950: '#09090b',
            },
            amber: {
              400: '#fbbf24',
              500: '#f59e0b',
              600: '#d97706',
            }
          },
          fontFamily: {
            sans: ['Satoshi', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          animation: {
            'shimmer': 'shimmer 2s linear infinite',
            'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
          },
          keyframes: {
            shimmer: {
              'from': { backgroundPosition: '200% 0' },
              'to': { backgroundPosition: '-200% 0' }
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #09090b; /* zinc-950 */
      color: #fafafa;
    }
    
    /* Scrollbar */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #09090b; }
    ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #3f3f46; }

    /* Skeleton Loader */
    .skeleton-box {
      background: linear-gradient(90deg, #18181b 25%, #27272a 50%, #18181b 75%);
      background-size: 200% 100%;
      animation: shimmer 2s infinite;
      border-radius: 4px;
    }
    
    /* Glassmorphism Refraction */
    .glass-panel {
      background: rgba(24, 24, 27, 0.4);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.05);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05), 0 8px 32px -8px rgba(0, 0, 0, 0.5);
    }
    
    /* Table Styles */
    table { width: 100%; border-collapse: separate; border-spacing: 0; }
    th {
      text-align: left;
      padding: 16px 24px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      background: rgba(9, 9, 11, 0.8);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    td {
      padding: 16px 24px;
      border-bottom: 1px solid rgba(255,255,255,0.03);
      transition: background-color 0.2s ease;
    }
    tr:last-child td { border-bottom: none; }
    
    /* Badges */
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 4px 10px;
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-family: 'JetBrains Mono', monospace;
    }
    .badge-amber { background: rgba(245, 158, 11, 0.1); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.2); box-shadow: inset 0 1px 0 rgba(245, 158, 11, 0.1); }
    .badge-emerald { background: rgba(16, 185, 129, 0.1); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.2); box-shadow: inset 0 1px 0 rgba(16, 185, 129, 0.1); }
    .badge-blue { background: rgba(59, 130, 246, 0.1); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.2); box-shadow: inset 0 1px 0 rgba(59, 130, 246, 0.1); }
    .badge-zinc { background: rgba(161, 161, 170, 0.1); color: #a1a1aa; border: 1px solid rgba(161, 161, 170, 0.2); box-shadow: inset 0 1px 0 rgba(161, 161, 170, 0.1); }
    
    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      margin-right: 6px;
    }
  </style>
</head>
<body class="min-h-screen font-sans">
<header class="border-b border-white/5 bg-zinc-950/80 backdrop-blur-sm sticky top-0 z-50">
    <div class="max-w-[1400px] mx-auto px-6 py-5 flex flex-col md:flex-row md:items-center justify-between gap-4">
      <div class="flex items-center gap-4">
        <div class="w-8 h-8 flex items-center justify-center bg-zinc-900 border border-white/10 rounded-lg shadow-[inset_0_1px_0_rgba(255,255,255,0.1)]">
          <div class="w-3 h-3 bg-amber-500 rounded-sm shadow-[0_0_10px_rgba(245,158,11,0.5)]"></div>
        </div>
        <div>
          <h1 class="font-bold text-xl tracking-tight text-zinc-50 leading-none">SOOTH<span class="text-zinc-500">.MARKET</span></h1>
          <div class="text-[10px] font-mono text-zinc-500 uppercase tracking-widest mt-1">Cross-Chain Registry Terminal</div>
        </div>
      </div>
      <div class="flex flex-wrap items-center gap-6 font-mono text-[11px] uppercase tracking-wider text-zinc-400">
        <div class="flex items-center gap-2">
          <span class="relative flex h-2 w-2">
            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
            <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
          </span>
          Base Sepolia
        </div>
        <div class="flex items-center gap-2">
          <span class="relative flex h-2 w-2">
            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75" style="animation-delay: 0.5s"></span>
            <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
          </span>
          Monad Testnet
        </div>
        <div class="flex items-center gap-2 opacity-50">
          <span class="w-2 h-2 rounded-full bg-amber-500"></span>
          Lens Testnet (Soon)
        </div>
      </div>
    </div>
</header>

<main class="max-w-[1400px] mx-auto px-6 py-8">
  <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
    <div class="relative group glass-panel p-8 rounded-lg overflow-hidden">
      <div class="absolute inset-0 bg-gradient-to-br from-white/[0.02] to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-500"></div>
      <div class="text-zinc-500 font-mono text-xs uppercase tracking-widest mb-4">Total Markets Indexed</div>
      <div class="text-4xl md:text-5xl font-mono text-zinc-50 tracking-tight" id="stat-total">
        <div class="h-10 w-24 skeleton-box"></div>
      </div>
    </div>

    <div class="relative group glass-panel p-8 rounded-lg overflow-hidden">
      <div class="absolute inset-0 bg-gradient-to-br from-amber-500/[0.03] to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-500"></div>
      <div class="text-zinc-500 font-mono text-xs uppercase tracking-widest mb-4">Total Deposits (USDC)</div>
      <div class="text-4xl md:text-5xl font-mono text-amber-500 tracking-tight" id="stat-vol">
        <div class="h-10 w-48 skeleton-box"></div>
      </div>
    </div>

    <div class="relative group glass-panel p-8 rounded-lg overflow-hidden">
      <div class="absolute inset-0 bg-gradient-to-br from-white/[0.02] to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-500"></div>
      <div class="text-zinc-500 font-mono text-xs uppercase tracking-widest mb-4">Active Protocol Nodes</div>
      <div class="text-4xl md:text-5xl font-mono text-zinc-50 tracking-tight">2</div>
    </div>
  </div>

  <div class="glass-panel rounded-lg overflow-hidden">
    <div class="px-6 py-5 border-b border-white/5 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 bg-zinc-950/50">
        <div class="flex items-center gap-3">
          <div class="w-1.5 h-6 bg-amber-500 rounded-full"></div>
          <h2 class="text-lg font-medium tracking-tight text-zinc-100">Market Instance Directory</h2>
        </div>
        <div class="flex items-center gap-3">
          <div class="text-[10px] text-zinc-500 font-mono border border-zinc-800 bg-zinc-900/50 px-2 py-1 rounded">PROTOCOL_V12.0</div>
          <div class="text-[10px] text-zinc-500 font-mono border border-zinc-800 bg-zinc-900/50 px-2 py-1 rounded flex items-center gap-1.5">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
            LIVE SYNC
          </div>
        </div>
      </div>
      <div class="overflow-x-auto">
        <table id="markets-table" class="w-full text-left whitespace-nowrap">
          <thead>
            <tr>
              <th class="font-mono text-[10px] text-zinc-500 tracking-widest uppercase font-semibold">Network</th>
              <th class="font-mono text-[10px] text-zinc-500 tracking-widest uppercase font-semibold">Market Address</th>
              <th class="font-mono text-[10px] text-zinc-500 tracking-widest uppercase font-semibold">Question</th>
              <th class="font-mono text-[10px] text-zinc-500 tracking-widest uppercase font-semibold">Creator</th>
              <th class="font-mono text-[10px] text-zinc-500 tracking-widest uppercase font-semibold">Status</th>
              <th class="font-mono text-[10px] text-zinc-500 tracking-widest uppercase font-semibold text-right">Deposit</th>
            </tr>
          </thead>
          <tbody id="markets-body"></tbody>

        </table>
      </div>
    </div>
  </div>
</main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.11.1/ethers.umd.min.js"></script>
  <script>
    const NETWORKS = [
      {
        name: 'Base Sepolia',
        chainId: 84532,
        rpc: 'https://sepolia.base.org',
        launchpad: '0xf00fb446d1262d1f4100e6d899cf0c8c298a6e61',
        explorer: 'https://sepolia.basescan.org'
      },
      {
        name: 'Monad Testnet',
        chainId: 10143,
        rpc: 'https://testnet-rpc.monad.xyz',
        launchpad: '0x6fd82b76045af934354a2033fde5cb64772ae615',
        explorer: 'https://testnet.monadvision.com'
      }
    ];

    const ABIS = {
      launchpad: [
        "function getMarkets() view returns (address[])",
        "function markets(address) view returns (address creator, address lpToken, uint256 bBase, uint256 bCurrent, uint256 creatorDeposit, uint256 feesAccrued, uint256 totalLPSupply, uint256 lpYieldPool, bool isGraduated, uint64 createdAt, uint64 graduatedAt)",
        "function trialStates(address) view returns (uint256, bool, uint256)"
      ],
      market: [
        "function question() view returns (string)",
        "function isSettled() view returns (bool)",
        "function isFinalized() view returns (bool)"
      ]
    };

    // ====== STATE ======
    let allMarkets = [];
    let currentFilter = 'all'; // 'all' | 'bonding' | 'live' | 'settled' | 'finalized' | 'dismissed'
    let currentSearch = '';
    let currentSort = { column: null, direction: 'asc' }; // column: null|'network'|'status'|'deposit'|'created'
    let chainStatus = {}; // { 'Base Sepolia': { status: 'ok'|'error'|'loading', markets: N, error: null|string } }

    // ====== HELPERS ======
    function formatAddress(addr) {
      if (!addr) return '';
      return `${addr.slice(0, 6)}...${addr.slice(-4)}`;
    }

    function formatWad(wad) {
      return (Number(ethers.formatUnits(wad || 0n, 18))).toLocaleString('en-US', {
        style: 'currency',
        currency: 'USD'
      });
    }

    function getMarketStatus(market) {
      if (market.isDismissed) return 'dismissed';
      if (market.isFinalized) return 'finalized';
      if (market.isSettled) return 'settled';
      if (market.isGraduated) return 'live';
      return 'bonding';
    }

    function getBadge(market) {
      const status = getMarketStatus(market);
      if (status === 'dismissed') return '<span class="badge badge-zinc"><span class="status-dot bg-zinc-400"></span>Dismissed</span>';
      if (status === 'finalized') return '<span class="badge badge-blue"><span class="status-dot bg-blue-400"></span>Finalized</span>';
      if (status === 'settled') return '<span class="badge badge-zinc"><span class="status-dot bg-zinc-400"></span>Settled</span>';
      if (status === 'live') return '<span class="badge badge-emerald"><span class="status-dot bg-emerald-400"></span>Live</span>';
      return '<span class="badge badge-amber"><span class="status-dot bg-amber-400"></span>Bonding</span>';
    }

    function renderSkeletons() {
      const tbody = document.getElementById('markets-body');
      tbody.innerHTML = '';
      for (let i = 0; i < 5; i++) {
        tbody.innerHTML += `
          <tr>
            <td><div class="h-4 w-24 skeleton-box"></div></td>
            <td><div class="h-4 w-32 skeleton-box"></div></td>
            <td><div class="h-4 w-64 skeleton-box"></div></td>
            <td><div class="h-4 w-32 skeleton-box"></div></td>
            <td><div class="h-6 w-20 skeleton-box" style="border-radius: 9999px;"></div></td>
            <td><div class="h-4 w-24 skeleton-box ml-auto"></div></td>
          </tr>
        `;
      }
    }

    // ====== RENDERING ======
    function renderTable(markets) {
      const tbody = document.getElementById('markets-body');
      tbody.innerHTML = '';

      // Update stats
      document.getElementById('stat-total').innerText = markets.length;
      const displayedDeposits = markets.reduce((sum, m) => sum + (m.deposit || 0n), 0n);
      document.getElementById('stat-vol').innerText = formatWad(displayedDeposits);

      if (markets.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="6" class="py-16 text-center">
              <div class="flex flex-col items-center justify-center gap-2">
                <div class="w-10 h-10 rounded-full border border-white/10 bg-zinc-900/50 flex items-center justify-center mb-2">
                  <div class="w-4 h-4 rounded-sm border border-zinc-700"></div>
                </div>
                <div class="text-zinc-300 font-medium">No markets found</div>
                <div class="text-zinc-500 text-sm">Try adjusting your filters or search.</div>
              </div>
            </td>
          </tr>
        `;
        return;
      }

      markets.forEach(m => {
        const row = document.createElement('tr');
        row.className = 'hover:bg-zinc-900/50 transition-colors group cursor-default';

        let networkColorClass = 'bg-zinc-500';
        if (m.network.includes('Base')) networkColorClass = 'bg-blue-500';
        if (m.network.includes('Monad')) networkColorClass = 'bg-purple-500';

        row.innerHTML = `
          <td>
            <div class="flex items-center gap-2">
              <span class="w-1.5 h-1.5 rounded-full ${networkColorClass}"></span>
              <span class="text-zinc-300 font-medium text-sm">${m.network}</span>
            </div>
          </td>
          <td class="font-mono text-zinc-400 text-xs tracking-wider">
            <span class="bg-zinc-900 px-2 py-1 rounded border border-white/5 group-hover:border-white/10 transition-colors">${formatAddress(m.address)}</span>
          </td>
          <td class="font-medium text-zinc-100 max-w-xs truncate" title="${m.question}">${m.question}</td>
          <td class="font-mono text-zinc-500 text-xs tracking-wider">${formatAddress(m.creator)}</td>
          <td>${getBadge(m)}</td>
          <td class="text-zinc-300 font-mono text-xs tracking-wider text-right">${formatWad(m.deposit)}</td>
        `;
        tbody.appendChild(row);
      });
    }

    // ====== FILTERING ======
    function applyFiltersAndSort() {
      let markets = [...allMarkets];

      // Apply search filter
      if (currentSearch) {
        const search = currentSearch.toLowerCase();
        markets = markets.filter(m =>
          m.question.toLowerCase().includes(search) ||
          m.address.toLowerCase().includes(search) ||
          m.creator.toLowerCase().includes(search)
        );
      }

      // Apply status filter
      if (currentFilter !== 'all') {
        markets = markets.filter(m => getMarketStatus(m) === currentFilter);
      }

      // Apply sort
      if (currentSort.column) {
        const dir = currentSort.direction === 'asc' ? 1 : -1;
        markets.sort((a, b) => {
          switch (currentSort.column) {
            case 'network':
              return dir * a.network.localeCompare(b.network);
            case 'status': {
              const order = ['bonding', 'live', 'settled', 'finalized', 'dismissed'];
              return dir * (order.indexOf(getMarketStatus(a)) - order.indexOf(getMarketStatus(b)));
            }
            case 'deposit':
              return dir * (a.deposit > b.deposit ? 1 : a.deposit < b.deposit ? -1 : 0);
            case 'created':
              return dir * (a.createdAt - b.createdAt);
            default:
              return 0;
          }
        });
      }

      renderTable(markets);
    }

    // ====== DATA FETCHING ======
    window.loadData = async function loadData() {
      renderSkeletons();
      allMarkets = [];
      chainStatus = {};

      for (const net of NETWORKS) {
        chainStatus[net.name] = { status: 'loading', markets: 0, error: null };
        try {
          const provider = new ethers.JsonRpcProvider(net.rpc);
          const launchpad = new ethers.Contract(net.launchpad, ABIS.launchpad, provider);

          const addresses = await launchpad.getMarkets();

          // Parallel fetch all markets on this chain
          const marketResults = await Promise.all(
            addresses.map(async (address) => {
              try {
                const [marketData, trialState] = await Promise.all([
                  launchpad.markets(address),
                  launchpad.trialStates(address)
                ]);

                const marketContract = new ethers.Contract(address, ABIS.market, provider);

                let question = '';
                let settled = false;
                let finalized = false;

                await Promise.all([
                  marketContract.question().then(q => { question = q; }).catch(() => {}),
                  marketContract.isSettled().then(s => { settled = s; }).catch(() => {}),
                  marketContract.isFinalized().then(f => { finalized = f; }).catch(() => {})
                ]);

                if (!question || question.trim() === '') question = 'Untitled Market';

                return {
                  network: net.name,
                  address,
                  question,
                  creator: marketData.creator,
                  isGraduated: marketData.isGraduated,
                  isDismissed: trialState[1],
                  isSettled: settled,
                  isFinalized: finalized,
                  deposit: marketData.creatorDeposit,
                  createdAt: Number(marketData.createdAt)
                };
              } catch (err) {
                console.error(`Failed to load market ${address} on ${net.name}`, err);
                return null;
              }
            })
          );

          const validMarkets = marketResults.filter(m => m !== null);
          allMarkets.push(...validMarkets);
          chainStatus[net.name] = { status: 'ok', markets: validMarkets.length, error: null };

        } catch (err) {
          console.error(`Failed to load network ${net.name}`, err);
          chainStatus[net.name] = { status: 'error', markets: 0, error: err.message || 'RPC error' };
        }
      }

      applyFiltersAndSort();
    }

    window.addEventListener('load', loadData);
  </script>
</body>
</html>
