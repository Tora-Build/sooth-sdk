<svg width="1500" height="500" viewBox="0 0 1500 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky-deep" x1="0" y1="0" x2="0" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#01040D" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <radialGradient id="aurora-c" cx="10%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="aurora-p" cx="90%" cy="80%" r="70%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#1E293B" stroke-width="0.5" />
    </pattern>
    <filter id="layered-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="1500" height="500" fill="url(#sky-deep)" />
  <rect width="1500" height="500" fill="url(#grid)" />
  <rect width="1500" height="500" fill="url(#aurora-c)" />
  <rect width="1500" height="500" fill="url(#aurora-p)" />

  <!-- Background Architecture Scaffolding -->
  <g opacity="0.04" stroke="white" stroke-width="1">
    <path d="M750 -150 L1650 250 L750 650 L-150 250 Z" />
    <path d="M750 50 L1450 350 L750 650 L50 350 Z" />
    <path d="M750 150 L1250 350 L750 550 L250 350 Z" />
  </g>

  <!-- Orbital Data Flux -->
  <g opacity="0.25" stroke-width="0.5" stroke-dasharray="2 12">
    <ellipse cx="750" cy="250" rx="650" ry="280" stroke="#22D3EE" transform="rotate(-2 750 250)" />
    <ellipse cx="750" cy="250" rx="850" ry="350" stroke="#818CF8" transform="rotate(4 750 250)" />
  </g>

  <!-- Central High-Impact Mark -->
  <g transform="translate(600, 75) scale(1.5)" filter="url(#layered-glow)">
    <path d="M100 50L180 120L100 190L20 120Z" fill="#818CF8" opacity="0.15" stroke="#818CF8" stroke-width="1" />
    <path d="M100 30L180 100L100 170L20 100Z" fill="#C084FC" opacity="0.15" stroke="#C084FC" stroke-width="1" />
    <path d="M100 10L180 80L100 150L20 80Z" fill="#22D3EE" opacity="0.25" stroke="#22D3EE" stroke-width="2" />
    <path d="M100 10V190" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.9" />
    <circle cx="100" cy="10" r="3" fill="white" />
  </g>

  <!-- Light Particles -->
  <g fill="white" opacity="0.5">
    <circle cx="300" cy="100" r="1" />
    <circle cx="1200" cy="400" r="1.5" />
    <circle cx="800" cy="50" r="1" />
    <circle cx="1400" cy="200" r="1" />
    <circle cx="100" cy="300" r="1" />
  </g>
</svg>



