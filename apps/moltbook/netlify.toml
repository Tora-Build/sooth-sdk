[build]
  command = "cd ../.. && pnpm install && cd apps/moltbook && ./node_modules/.bin/vite build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  VITE_INDEXER_URL = "https://sooth-indexer.onrender.com"
  VITE_MONAD_RPC_URL = "https://rpc.sooth.market/monad"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
