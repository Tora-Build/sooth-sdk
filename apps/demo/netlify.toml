[build]
  command = "cd ../.. && pnpm install && pnpm --filter @sooth/sdk-core build && cd apps/web && pnpm build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  VITE_MONAD_RPC_URL = "https://rpc.sooth.market/monad"
  VITE_INDEXER_URL = "https://sooth-indexer.onrender.com"

[[edge_functions]]
  function = "check-access"
  path = "/api/check-access"

[[edge_functions]]
  function = "request-access"
  path = "/api/request-access"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
