<svg width="1500" height="500" viewBox="0 0 1500 500" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Sooth Social Banner</title>
  <desc id="desc">Right-aligned elegant branding for Sooth Protocol, featuring a larger and brighter layered brand mark.</desc>
  <defs>
    <linearGradient id="sky-elegant" x1="0" y1="0" x2="0" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#01040D" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <radialGradient id="soft-shimmer" cx="90%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0" />
    </radialGradient>
    <filter id="ultra-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1500" height="500" fill="url(#sky-elegant)" />
  <rect width="1500" height="500" fill="url(#soft-shimmer)" />

  <!-- Ultra-Thin Geometric Accents -->
  <g opacity="0.1" stroke="white" stroke-width="0.5">
    <path d="M0 250 H1500" stroke-dasharray="1 30" />
    <path d="M1250 0 V500" opacity="0.5" />
    <circle cx="1250" cy="250" r="450" stroke-opacity="0.2" />
    <circle cx="1250" cy="250" r="700" stroke-opacity="0.1" />
  </g>

  <!-- Right-Aligned Composition -->
  <g transform="translate(1420, 250)">
    
    <!-- Typography Section -->
    <g text-anchor="end">
      <text y="15" font-family="system-ui, sans-serif" font-size="110" font-weight="200" fill="white" letter-spacing="48">SOOTH</text>
      
      <!-- Protocol Pillars -->
      <g transform="translate(-10, 75)">
        <text font-family="monospace" font-size="16" font-weight="300" fill="#94A3B8" letter-spacing="12">
          <tspan fill="#22D3EE" font-weight="600">TRUTH</tspan> • 
          <tspan fill="white" opacity="0.3">LIQUIDITY</tspan> • 
          <tspan fill="#818CF8" font-weight="600">FINALITY</tspan>
        </text>
      </g>
    </g>

    <!-- Brighter and Larger Brand Mark -->
    <!-- Scale increased to 0.9, position adjusted slightly to maintain balance -->
    <g transform="translate(-920, -75) scale(0.9)" filter="url(#ultra-glow)">
      <path d="M100 50L180 120L100 190L20 120Z" stroke="#818CF8" stroke-width="1.5" fill="none" opacity="0.6" />
      <path d="M100 30L180 100L100 170L20 100Z" stroke="#C084FC" stroke-width="1.5" fill="none" opacity="0.6" />
      <path d="M100 10L180 80L100 150L20 80Z" stroke="#22D3EE" stroke-width="3" fill="none" opacity="0.8" />
      <path d="M100 10V190" stroke="white" stroke-width="2.5" stroke-linecap="round" opacity="1.0" />
    </g>

  </g>

  <!-- Delicate Atmospheric Light -->
  <g fill="white" opacity="0.2">
    <circle cx="150" cy="150" r="0.5" />
    <circle cx="1300" cy="400" r="0.8" />
    <circle cx="600" cy="450" r="0.5" />
  </g>
</svg>





























