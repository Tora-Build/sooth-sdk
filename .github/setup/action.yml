name: Setup Node
description: Set up Node.js environment with pnpm and cached dependencies

runs:
  using: composite
  steps:
    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        check-latest: true

    - name: Enable Corepack
      shell: bash
      run: |
        corepack enable
        corepack prepare pnpm@latest --activate

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
