name: Setup Node
description: Set up Node.js environment with pnpm and cached dependencies

runs:
  using: composite
  steps:
    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: 22.x
        check-latest: true

    - name: Enable Corepack
      shell: bash
      run: |
        corepack enable
        # Pin to package.json#packageManager. `@latest` would execute an
        # unreviewed pnpm release during install.
        corepack prepare pnpm@9.15.9 --activate

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
