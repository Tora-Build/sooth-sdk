name: release-please

# Manual only — see sooth-core: push-triggered runs minted phantom releases.
on:
  workflow_dispatch:

concurrency:
  group: release-please
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_created: ${{ steps.release.outputs.releases_created }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: .github/release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.ALPHA_PAT }}

  npm-publish:
    needs: release-please
    # workflow_dispatch allows publishing the current main manually (e.g. a
    # release that was tagged before this job existed); npm rejects duplicates.
    if: needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # OIDC token for npm Trusted Publishing — auth comes from the workflow
      # identity (repo + workflow filename), not a long-lived token. Publishes
      # from forks or renamed workflows will not be trusted.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Trusted Publishing requires npm >= 11.5.1 (Node 24 ships npm 11).
          node-version: 24.x
          registry-url: 'https://registry.npmjs.org'
      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Publish to npm
        run: npm publish
