name: Notify sooth-alpha of SDK update

# Only fires on main — prevents per-commit spam from develop.
# Both sooth-alpha/main and sooth-alpha/develop are bumped to the same
# SHA so they never drift from each other (see sooth-alpha issue #88).
on:
  push:
    branches: [main]
    # Only the SQF utility surface sooth-alpha vendors; a
    # changelog or CI push no longer costs two bump runs + two CI runs.
    paths:
      - 'src/**'
      - 'package.json'

# Dispatch uses ALPHA_PAT; the workflow GITHUB_TOKEN needs no permissions.
permissions: {}

concurrency:
  group: notify-alpha
  cancel-in-progress: false  # queue, never drop a main-push notification

jobs:
  bump-main:
    name: Bump sooth-alpha/main
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.ALPHA_PAT }}
          repository: Tora-Build/sooth-alpha
          event-type: sdk-update
          client-payload: |
            {"alpha_branch":"main","sdk_sha":"${{ github.sha }}"}

  bump-develop:
    name: Bump sooth-alpha/develop
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: bump-main  # serialize so alpha/develop never gets ahead of alpha/main
    steps:
      - uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.ALPHA_PAT }}
          repository: Tora-Build/sooth-alpha
          event-type: sdk-update
          client-payload: |
            {"alpha_branch":"develop","sdk_sha":"${{ github.sha }}"}
