name: Notify sooth-alpha of SDK update

on:
  push:
    branches: [develop, main]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger submodule bump in sooth-alpha
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.ALPHA_PAT }}
          repository: Tora-Build/sooth-alpha
          event-type: submodule-update
          client-payload: |
            {"alpha_branch":"${{ github.ref_name }}","sdk_branch":"${{ github.ref_name }}","sdk_sha":"${{ github.sha }}"}
