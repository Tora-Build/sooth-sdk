name: CI

on:
  pull_request:
    paths-ignore: &docs
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore: *docs

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ github.event_name != 'pull_request' || !contains(github.event.pull_request.labels.*.name, 'early-stage') }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/setup
      - name: Lint sources
        run: pnpm lint:check

  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ github.event_name != 'pull_request' || !contains(github.event.pull_request.labels.*.name, 'early-stage') }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/setup
      - name: Check formatting
        run: pnpm fmt:check

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ github.event_name != 'pull_request' || !contains(github.event.pull_request.labels.*.name, 'early-stage') }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/setup
      - name: Type check
        run: pnpm typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ github.event_name != 'pull_request' || !contains(github.event.pull_request.labels.*.name, 'early-stage') }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/setup
      - name: Test
        # Until 2026-07-12 the spec files were never executed anywhere (no
        # test script, no CI step) and three of them had silently rotted.
        run: pnpm test

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ github.event_name != 'pull_request' || !contains(github.event.pull_request.labels.*.name, 'early-stage') }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/setup
      - name: Build
        run: pnpm build
      - name: Verify dist resolves in plain Node ESM
        # Bundlers tolerate extensionless relative imports; Node's ESM
        # resolver does not. Import every public entry point directly.
        run: |
          node --input-type=module -e "
            for (const p of ['./dist/index.js', './dist/core/index.js', './dist/lib/sqf.js']) {
              const m = await import(p);
              if (Object.keys(m).length === 0) throw new Error('no exports from ' + p);
              console.log(p, Object.keys(m).length, 'exports');
            }
          "
