name: Bump contracts-core submodule

on:
  repository_dispatch:
    types: [submodule-update]

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sooth-alpha
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.ALPHA_PAT }}
          submodules: true
          fetch-depth: 0

      - name: Update submodule to latest develop
        run: |
          git submodule update --remote packages/contracts-core
          echo "SUBMODULE_SHA=$(git -C packages/contracts-core rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Check for changes
        id: check
        run: |
          if git diff --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/contracts-core
          git commit -m "chore(contracts): update sooth-core submodule to ${{ env.SUBMODULE_SHA }}"
          git push origin develop
