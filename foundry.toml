[profile.default]
src = "contracts"
out = "out"
test = "test"
libs = ["lib"]
solc_version = "0.8.30"
optimizer = true
optimizer_runs = 200
via_ir = true
remappings = [
  "forge-std/=lib/forge-std/src/",
  "prb-math/=lib/prb-math/"
]
fs_permissions = [{ access = "read-write", path = "./"}]

[rpc_endpoints]
base_sepolia = "${RPC_URL}"
monad_testnet = "${MONAD_RPC_URL}"
