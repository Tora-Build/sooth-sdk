# Updated for SoothBook V12 (was TickBook)
# Trial Period Test (V12)
#
# Demonstrates V12 trial period dismissal and refund flow:
#   alice   = creator (creates market, waits for trial to end, then dismisses)
#   bob     = trader (buys YES during trial, claims refund after dismissal)
#   charlie = trader (buys NO during trial, claims refund after dismissal)
#
# V11 Trial Period Rules:
#   - Trial period = 7 days after market creation
#   - During trial: trading is tracked, costs are locked
#   - AFTER trial ends:
#     - If GRADUATED: market continues, dismiss NOT allowed (traction proven)
#     - If NOT GRADUATED: creator CAN dismiss, traders get refunds
#
# IMPORTANT: This scenario requires time manipulation to work:
#   - On Anvil: Use `cast rpc evm_increaseTime 604801` before dismiss step
#   - On testnets: Must wait 7 days after market creation
#
# Flow:
#   1. Snapshot initial balances
#   2. Alice creates market (trial period starts)
#   3. Bob and Charlie fund accounts and trade on AMM
#   4. Show trial status (locked costs visible)
#   5. [TIME PASSES: 7+ days] - Manual step on testnets
#   6. Alice dismisses market (only works after trial ends AND if not graduated)
#   7. Bob and Charlie claim refunds
#   8. Verify checksum (all funds should balance)

name: trial-period
description: Trial period dismissal and refund flow with multi-actor verification

steps:
  # ============================================================
  # PHASE 0: Snapshot (capture balances BEFORE any minting)
  # ============================================================
  - actor: alice
    action: snapshot
    args: {}

  # ============================================================
  # PHASE 1: Market Creation (Alice creates with herself as adjudicator)
  # ============================================================
  - actor: alice
    action: mint
    args:
      amount: "50000"

  - actor: alice
    action: approve
    args:
      contract: "all"

  - actor: alice
    action: createmarket
    args:
      template: "alien"
      liquidity: "500"

  - actor: alice
    action: setmarket
    args:
      address: "created"

  # ============================================================
  # PHASE 2: Fund traders and trade on AMM (during trial period)
  # ============================================================
  - actor: bob
    action: mint
    args:
      amount: "10000"

  - actor: bob
    action: approve
    args:
      contract: "all"

  - actor: charlie
    action: mint
    args:
      amount: "10000"

  - actor: charlie
    action: approve
    args:
      contract: "all"

  # Bob buys YES shares (cost gets locked during trial)
  - actor: bob
    action: market
    args:
      direction: "buy"
      outcome: "yes"
      shares: "100"

  # Charlie buys NO shares (cost gets locked during trial)
  - actor: charlie
    action: market
    args:
      direction: "buy"
      outcome: "no"
      shares: "100"

  # ============================================================
  # PHASE 3: Check trial status (shows locked costs, trial active)
  # ============================================================
  - actor: alice
    action: trialstatus
    args: {}

  - actor: alice
    action: marketstatus
    args: {}

  # ============================================================
  # PHASE 4: Wait for trial period to end
  # ============================================================
  # MANUAL STEP REQUIRED:
  #   On Anvil:   cast rpc evm_increaseTime 604801 --rpc-url $RPC_URL
  #               cast rpc evm_mine --rpc-url $RPC_URL
  #   On testnet: Wait 7 days from market creation
  #
  # The dismiss command will fail if trial has not ended!

  # ============================================================
  # PHASE 5: Creator dismisses market (AFTER trial period ends)
  # ============================================================
  # NOTE: This will revert with "LaunchpadEngine: trial not ended"
  # if you haven't advanced time past the 7-day trial period.
  - actor: alice
    action: dismiss
    args: {}

  # Verify dismissal
  - actor: alice
    action: trialstatus
    args: {}

  # ============================================================
  # PHASE 6: Traders claim refunds
  # ============================================================
  - actor: bob
    action: claimrefund
    args: {}

  - actor: charlie
    action: claimrefund
    args: {}

  # ============================================================
  # PHASE 7: Verify all funds balance (checksum)
  # ============================================================
  - actor: alice
    action: trialstatus
    args: {}

  - actor: alice
    action: checksum
    args: {}
