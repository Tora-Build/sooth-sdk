# Updated for SoothBook V12 (was TickBook)
# Stress Test Scenario
# Places many orders to stress test the orderbook

name: stress-orderbook
description: Stress test with many orders from multiple actors

steps:
  # Setup with large balances
  - actor: alice
    action: mint
    args:
      amount: "1000000"

  - actor: alice
    action: approve
    args:
      contract: "soothbook"

  - actor: bob
    action: mint
    args:
      amount: "1000000"

  - actor: bob
    action: approve
    args:
      contract: "soothbook"

  - actor: charlie
    action: mint
    args:
      amount: "1000000"

  - actor: charlie
    action: approve
    args:
      contract: "soothbook"

  # Alice places many YES orders at different ticks
  - actor: alice
    action: buyyes
    args:
      tick: 150
      amount: "1000"

  - actor: alice
    action: buyyes
    args:
      tick: 250
      amount: "1000"

  - actor: alice
    action: buyyes
    args:
      tick: 350
      amount: "1000"

  - actor: alice
    action: buyyes
    args:
      tick: 450
      amount: "1000"

  - actor: alice
    action: buyyes
    args:
      tick: 550
      amount: "1000"

  # Bob places many NO orders at different ticks
  - actor: bob
    action: buyno
    args:
      tick: 450
      amount: "1000"

  - actor: bob
    action: buyno
    args:
      tick: 550
      amount: "1000"

  - actor: bob
    action: buyno
    args:
      tick: 650
      amount: "1000"

  - actor: bob
    action: buyno
    args:
      tick: 750
      amount: "1000"

  - actor: bob
    action: buyno
    args:
      tick: 850
      amount: "1000"

  # Charlie executes many market orders
  - actor: charlie
    action: buyno
    args:
      tick: 950
      amount: "500"

  - actor: charlie
    action: buyno
    args:
      tick: 950
      amount: "500"

  - actor: charlie
    action: buyyes
    args:
      tick: 950
      amount: "500"

  - actor: charlie
    action: buyyes
    args:
      tick: 950
      amount: "500"

  - actor: charlie
    action: buyno
    args:
      tick: 950
      amount: "500"

  # Check final state
  - actor: alice
    action: state
    args: {}

  - actor: alice
    action: book
    args: {}

  - actor: alice
    action: positions
    args: {}

assertions:
  - "market.has_liquidity"
  - "all_actors.have_positions"
  - "vault.solvent"
  - "no_order_overflow"
